<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- iPad / 手机「添加到主屏幕」后全屏打开，没有地址栏，像原生 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3D动画知识库">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a6cd6'/%3E%3Ctext x='32' y='44' font-size='31' font-family='sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E3D%3C/text%3E%3C/svg%3E">
<title>3D 知识点动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    background:#0b1220;color:#e8eef7;overflow:hidden;height:100vh;height:100dvh;}
  #app{display:flex;height:100vh;height:100dvh;width:100vw;position:relative;}
  #viewport{flex:1;position:relative;min-width:0;touch-action:none;}
  canvas{display:block;}

  .topbar{position:absolute;top:0;left:0;right:0;padding:15px 22px;
    background:linear-gradient(180deg,rgba(11,18,32,.92),rgba(11,18,32,0));
    pointer-events:none;z-index:10;}
  .topbar .t1{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .topbar .t2{font-size:12.5px;color:#8fa3c0;margin-top:3px;}
  .eq{position:absolute;top:15px;right:22px;z-index:10;
    background:rgba(30,45,70,.85);border:1px solid rgba(120,160,220,.3);
    border-radius:10px;padding:10px 15px;font-size:15.5px;font-weight:750;
    backdrop-filter:blur(6px);max-width:44%;line-height:1.5;}
  .eq small{display:block;font-size:11.5px;font-weight:600;color:#8fa3c0;margin-top:5px;letter-spacing:0;line-height:1.5;}

  /* 字幕条 —— 电脑上浮在画面下方；手机上移到画面外面，绝不遮挡动画 */
  #caption{position:absolute;left:0;width:calc(100% - 318px);bottom:96px;z-index:12;
    text-align:center;pointer-events:none;transition:opacity .3s;opacity:0;}
  #caption.show{opacity:1;}
  #caption .capbox{display:inline-block;max-width:min(880px,92%);text-align:center;
    background:rgba(16,26,44,.93);border:1px solid rgba(93,155,255,.32);
    border-radius:13px;padding:14px 26px;font-size:20px;font-weight:600;
    line-height:1.7;letter-spacing:.2px;color:#f2f7ff;backdrop-filter:blur(8px);}
  #caption .spk{display:inline-block;font-size:13px;font-weight:800;color:#5d9bff;
    letter-spacing:1.5px;margin-right:9px;vertical-align:2px;}
  #eqmini{display:none;}

  #side{width:318px;flex-shrink:0;background:#101a2c;border-left:1px solid #1e2c44;
    display:flex;flex-direction:column;overflow-y:auto;}
  .sec{padding:14px 18px;border-bottom:1px solid #1a2740;}
  .sec .h{font-size:12px;font-weight:800;color:#5b8ddb;letter-spacing:1.5px;margin-bottom:9px;}
  .stepbox{background:#16233a;border-radius:9px;padding:10px 13px;margin-bottom:8px;
    border-left:3px solid #3d6fd4;transition:all .3s;}
  .stepbox.on{background:#1c3252;border-left-color:#5d9bff;box-shadow:0 0 0 1px rgba(93,155,255,.35);}
  .stepbox .n{font-size:10.5px;color:#6f87a8;font-weight:700;margin-bottom:3px;}
  .stepbox .d{font-size:12.5px;line-height:1.65;color:#b7c6dc;}
  .stepbox.on .d{color:#e8eef7;font-weight:650;}
  .hint{font-size:12.5px;color:#8fa3c0;line-height:1.85;}
  .hint b{color:#e8eef7;}
  .legend{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;font-size:13px;color:#c3d2e6;}
  .legend i{width:15px;height:15px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;}

  .param{margin:11px 0;}
  .param label{font-size:12.5px;color:#a8bcd8;display:flex;justify-content:space-between;
    align-items:baseline;margin-bottom:5px;font-weight:600;}
  .param label b{color:#5d9bff;font-size:14px;font-variant-numeric:tabular-nums;}
  .param input[type=range]{width:100%;accent-color:#5d9bff;}

  #ctrl{position:absolute;bottom:0;left:0;right:0;padding:13px 22px 17px;
    background:linear-gradient(0deg,rgba(11,18,32,.96),rgba(11,18,32,0));
    display:flex;align-items:center;gap:11px;z-index:10;flex-wrap:wrap;}
  button,#ctrl a{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    background:#22334f;color:#dce8f7;border:1px solid #33507a;
    border-radius:8px;padding:8px 15px;transition:.2s;text-decoration:none;display:inline-block;}
  button:hover{background:#2c4468;border-color:#4a76b5;}
  button.pri{background:#3d6fd4;border-color:#5b8ef0;color:#fff;}
  button.pri:hover{background:#4a80e6;}
  button.mute{background:#2a2036;border-color:#5a4374;color:#d9c8f5;}
  button.mute.on{background:#5a3f86;border-color:#9c82e8;color:#fff;}
  button.fs{background:#1c3b33;border-color:#2f7a63;color:#a8f0d6;}
  .progress{flex:1;min-width:140px;height:6px;background:#1c2a42;border-radius:3px;overflow:hidden;position:relative;}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3d6fd4,#5d9bff);}
  .progress .marks{position:absolute;inset:0;display:flex;pointer-events:none;}
  .progress .marks span{flex-grow:0;border-right:1px solid rgba(255,255,255,.22);}
  .sp{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8fa3c0;}
  .sp input{width:84px;accent-color:#5d9bff;}

  #quiz{position:absolute;inset:0;background:rgba(8,13,23,.95);z-index:50;
    display:none;align-items:center;justify-content:center;padding:26px;}
  #quiz.show{display:flex;}
  .qcard{max-width:680px;width:100%;background:#101a2c;border:1px solid #24354f;
    border-radius:14px;padding:24px 27px;max-height:92vh;overflow-y:auto;}
  .qcard .qh{font-size:12px;font-weight:800;color:#5b8ddb;letter-spacing:1.5px;margin-bottom:12px;}
  .qcard .q{font-size:17px;line-height:1.85;margin-bottom:14px;color:#e8eef7;}
  .opt{background:#16233a;border:1px solid #24354f;border-radius:9px;padding:12px 16px;
    margin:9px 0;font-size:16px;cursor:pointer;transition:.2s;color:#c3d2e6;}
  .opt:hover{border-color:#4a76b5;background:#1c2c46;}
  .opt.right{background:#16331f;border-color:#2f8f52;color:#9ff0b8;}
  .opt.wrong{background:#331717;border-color:#a53838;color:#f7a8a8;}
  .exp{margin-top:13px;padding:15px 17px;background:#16233a;border-radius:9px;
    font-size:15px;line-height:1.85;color:#c3d2e6;display:none;}
  .exp.show{display:block;}
  .exp b{color:#9ff0b8;}
  .exp .ehead{font-size:16px;font-weight:800;color:#ffd166;margin-bottom:8px;}
  .exp .ebox{margin-top:11px;padding:11px 13px;border-radius:8px;background:#1b2a42;
    border-left:3px solid #5d9bff;}
  .exp .ebox .et{font-size:12px;font-weight:800;color:#7fb0ff;letter-spacing:1px;margin-bottom:5px;}
  .exp .ebox.metro{border-left-color:#ffb454;}
  .exp .ebox.metro .et{color:#ffb454;}
  .exp .ebox.warn{border-left-color:#ff7b7b;}
  .exp .ebox.warn .et{color:#ff9b9b;}
  .exp .ebox.step{border-left-color:#7de2a0;}
  .exp .ebox.step .et{color:#7de2a0;}
  #loadmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#8fa3c0;z-index:60;background:#0b1220;text-align:center;padding:24px;line-height:1.8;}

  /* ---------- 手机 / 窄屏适配：画面在上，字幕独立一条，文字在下 ----------
     除了窄屏，**竖屏的平板**（iPad 810/820/834 宽）也走这一套：
     否则 iPad 竖屏会落进电脑版双栏，3D 区被 318px 侧栏挤成窄条。 */
  @media (max-width: 900px), (orientation: portrait) and (max-width: 1100px){
    #app{flex-direction:column;}
    #viewport{flex:none;height:46vh;min-height:250px;}
    #side{width:100%;flex:1 1 auto;border-left:none;border-top:1px solid #1e2c44;}
    .topbar{padding:9px 13px;}
    .topbar .t1{font-size:14px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar .t2{display:none;}
    /* 手机上没有横向空间放浮层，公式/要点改到字幕条里显示，画面顶部彻底空出来 */
    .eq{display:none;}
    #eqmini{display:block;font-size:12.5px;font-weight:800;color:#ffd166;
      margin-bottom:5px;line-height:1.45;letter-spacing:.2px;}

    /* 字幕：从浮层变成画面下面的一条，永远看得见，也不压画面 */
    #caption{position:static;width:100%;bottom:auto;opacity:1;text-align:left;
      background:#0e1830;border-top:1px solid #22345a;border-bottom:1px solid #22345a;
      padding:9px 14px;flex:none;max-height:22vh;overflow-y:auto;}
    #caption .capbox{display:block;max-width:100%;background:none;border:none;
      border-radius:0;padding:0;font-size:16px;line-height:1.62;text-align:left;font-weight:600;}
    #caption .spk{display:none;}

    #ctrl{padding:7px 9px 9px;gap:6px;}
    #ctrl button{padding:7px 9px;font-size:12.5px;}
    .progress{order:10;flex:1 1 100%;min-width:0;margin-top:2px;}
    .sp{display:none;}
    .sec{padding:11px 13px;}
    .sec .h{margin-bottom:7px;}
    .stepbox{padding:8px 11px;margin-bottom:6px;}
    .stepbox .d{font-size:12.5px;line-height:1.6;}
    .legend{font-size:12.5px;}
    .qcard .q{font-size:16px;}
    .opt{font-size:15px;}
    .exp{font-size:14.5px;}
  }
  @media (max-width: 420px){
    #viewport{height:42vh;min-height:230px;}
    #ctrl button{padding:6px 8px;font-size:12px;}
    #caption{font-size:15.5px;padding:8px 12px;}
    #caption .capbox{font-size:15.5px;}
  }
  /* 竖屏平板（iPad）：屏幕大，3D 区给高一点，字幕字也大一点 */
  @media (min-width: 700px) and (max-width: 1100px) and (orientation: portrait){
    #viewport{height:54vh;min-height:420px;}
    #caption{font-size:17.5px;padding:12px 22px;}
    #caption .capbox{font-size:17.5px;}
    #eqmini{font-size:14px;}
    .stepbox .d{font-size:14px;}
    .sec .h{font-size:13px;}
  }
  /* 全屏时把动画区再放大一些 */
  #app:fullscreen #viewport{height:62vh;}
  #app:-webkit-full-screen #viewport{height:62vh;}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="loadmsg">3D 动画与语音加载中…<br><span style="font-size:12.5px">（首次打开约需 1 秒）</span></div>
    <div class="topbar">
      <div class="t1" id="ttl"></div>
      <div class="t2" id="sub"></div>
    </div>
    <div class="eq" id="eq"></div>
    <div id="ctrl">
      <button class="pri" id="btnPlay">▶ 播放讲解</button>
      <button id="btnReset">↺ 重播</button>
      <button class="mute" id="btnMute">🔊 声音开</button>
      <button class="fs" id="btnFull">⛶ 全屏</button>
      <div class="progress"><div class="bar" id="bar"></div><div class="marks" id="marks"></div></div>
      <div class="sp">速度 <input type="range" id="spd" min="0.5" max="1.8" step="0.1" value="1"></div>
      <button id="btnQuiz" style="background:#7a5cd6;border-color:#9c82e8;color:#fff;">自测 ▸</button>
      <a href="dashboard.html" style="background:#1c3b33;border-color:#2f7a63;color:#a8f0d6;">📊 学习记录</a>
    </div>
  </div>
  <div id="caption"><div class="capbox"><div id="eqmini"></div><span class="spk">讲解</span><span id="captext"></span></div></div>
  <div id="side">
    <div class="sec"><div class="h">讲解步骤</div><div id="steps"></div></div>
    <div class="sec" id="paramSec" style="display:none;"><div class="h" id="paramTitle">动手调一调</div><div id="params"></div></div>
    <div class="sec" id="legendSec" style="display:none;"><div class="h">图例</div><div class="legend" id="legend"></div></div>
    <div class="sec"><div class="h">怎么用</div><div class="hint" id="hint"></div></div>
  </div>
  <div id="quiz"><div class="qcard">
    <div class="qh">看完立刻做一题</div>
    <div class="q" id="qtext"></div>
    <div id="qopts"></div>
    <div class="exp" id="qexp"></div>
  </div></div>
</div>

<!-- 顺序很重要：先引擎库 → 再数据 → 再场景声明 → 再学习记录 → 最后启动引擎 -->

<script>
/* ================= 学习记录（纯本地，不上传，手机/电脑各自保存） =================
   记录内容：观看次数、观看时长、每段看了几次、自测对错、错题本、费曼打勾、复习计划 */
(function () {
  var KEY = 'qy_study_v1';
  var A = window.ANIM || {};
  var FILE = (location.pathname.split('/').pop() || 'index').replace(/\.html?$/i, '') || 'index';
  var SUBJ = (function (f) {
    if (f.indexOf('math_') === 0) return '数学';
    if (f.indexOf('phy_') === 0) return '物理';
    if (f.indexOf('chem_') === 0) return '化学';
    if (f.indexOf('exp_') === 0) return '实验';
    if (f.indexOf('sport_') === 0) return '体育';
    return '其他';
  })(FILE);

  function load() {
    try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function addDays(ds, n) {
    var p = ds.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n); return dstr(d);
  }
  var GAPS = [1, 3, 7, 15, 30];   // 费曼复习间隔（天）

  var DB = load();
  if (!DB || !DB.items) DB = { ver: 1, items: {}, days: {} };
  if (!DB.days) DB.days = {};

  var it = DB.items[FILE];
  if (!it) {
    it = DB.items[FILE] = {
      file: FILE, subject: SUBJ,
      title: A.title || FILE,
      visits: 0, seconds: 0,
      segMax: 0, segTotal: (A.stages || []).length,
      segSeen: {},
      quizRight: 0, quizWrong: 0, wrongs: [],
      feynman: [], reviewAt: 0, reviewDone: [], gapIdx: 0,
      firstAt: new Date().toISOString(), lastAt: ''
    };
  }
  it.title = A.title || it.title;
  it.segTotal = (A.stages || []).length || it.segTotal;
  it.visits = (it.visits || 0) + 1;
  it.lastAt = new Date().toISOString();

  var day = DB.days[today()] || (DB.days[today()] = { seconds: 0, items: [], quiz: 0 });
  if (day.items.indexOf(FILE) < 0) day.items.push(FILE);
  save(DB);

  /* ---- 时长统计：每秒看一次，只在「页面可见 + 正在播放」时累加 ---- */
  var lastTick = Date.now();
  setInterval(function () {
    var now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
    if (document.visibilityState !== 'visible') return;
    if (dt > 3) dt = 1;                       // 切回来时不要一次加太多
    var st = window.__ANIM_STATE__ ? window.__ANIM_STATE__() : null;
    if (!st || !st.playing) return;
    it.seconds = (it.seconds || 0) + dt;
    var d2 = DB.days[today()] || (DB.days[today()] = { seconds: 0, items: [], quiz: 0 });
    d2.seconds += dt;
    if (st.stage + 1 > (it.segMax || 0)) it.segMax = st.stage + 1;
    var sk = 's' + st.stage;
    it.segSeen[sk] = (it.segSeen[sk] || 0) + 1;
    save(DB);
  }, 1000);

  window.TRACK = {
    /* 引擎在每段开始时调用 */
    seg: function (i) {
      it.segSeen['s' + i] = (it.segSeen['s' + i] || 0) + 1;
      if (i + 1 > (it.segMax || 0)) it.segMax = i + 1;
      save(DB);
    },
    /* 整段讲完 */
    finish: function () {
      it.finishedAt = new Date().toISOString();
      if (!it.reviewAt) {                       // 第一次看完 → 安排复习计划
        it.reviewAt = addDays(today(), GAPS[0]);
        it.gapIdx = 0;
      }
      save(DB);
    },
    /* 自测作答：ok=是否答对 */
    quiz: function (ok, q, chosen) {
      var d3 = DB.days[today()];
      if (d3) d3.quiz = (d3.quiz || 0) + 1;
      if (ok) { it.quizRight = (it.quizRight || 0) + 1; }
      else {
        it.quizWrong = (it.quizWrong || 0) + 1;
        it.wrongs = it.wrongs || [];
        it.wrongs.unshift({
          q: q.q, opts: q.opts, answer: q.answer, chosen: chosen,
          exp: q.exp, t: new Date().toISOString(), fixed: false
        });
        if (it.wrongs.length > 60) it.wrongs.length = 60;
      }
      save(DB);
    }
  };
  window.__TRACK_DB__ = function () { return DB; };
})();
</script>
<script>
/* ================= 全屏按钮（iPhone 上降级为提示） ================= */
(function () {
  var btn = document.getElementById('btnFull'), root = document.getElementById('app');
  if (!btn || !root) return;
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function ok() { return !!(root.requestFullscreen || root.webkitRequestFullscreen); }
  function on() {
    var f = root.requestFullscreen || root.webkitRequestFullscreen;
    try { var p = f.call(root); if (p && p.catch) p.catch(function () { tip(); }); }
    catch (e) { tip(); }
  }
  function off() {
    var f = document.exitFullscreen || document.webkitExitFullscreen;
    if (f) try { f.call(document); } catch (e) {}
  }
  function tip() {
    alert('这个浏览器不支持网页全屏。\n\n【手机上这样看更大】\n点浏览器底部的「分享 / ⋯」→「添加到主屏幕」，\n以后从桌面图标打开，就是全屏效果。');
  }
  btn.addEventListener('click', function () { fsEl() ? off() : (ok() ? on() : tip()); });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      btn.textContent = fsEl() ? '⛶ 退出全屏' : '⛶ 全屏';
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 150);
    });
  });
})();
/* ================= 手机上把「公式/要点浮层」搬进字幕条 =================
   手机屏太窄，右上角的浮层会压住 3D 画面里的文字标签。
   这里把浮层内容实时镜像到字幕条上方，浮层本身用 CSS 隐藏。 */
(function () {
  var eqEl = document.getElementById('eq'), mini = document.getElementById('eqmini');
  if (!eqEl || !mini) return;
  function sync() {
    var t = (eqEl.textContent || '').replace(/\s+/g, ' ').trim();
    if (mini.textContent !== t) mini.textContent = t;
  }
  try {
    new MutationObserver(sync).observe(eqEl, { childList: true, subtree: true, characterData: true });
  } catch (e) {}
  sync();
})();
</script>

(function () {

  var cam = A.camera || {};

  var camGoal = lookV.clone();     // 目标注视点

  vp.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.74));
  var dl1 = new THREE.DirectionalLight(0xffffff, 0.86); dl1.position.set(7, 11, 9); scene.add(dl1);
  var dl2 = new THREE.DirectionalLight(0x8fb4ff, 0.34); dl2.position.set(-9, 5, -7); scene.add(dl2);

  var world = new THREE.Group(); scene.add(world);

  if (A.grid) {
    var g = new THREE.GridHelper(A.grid.size || 20, A.grid.div || 20, 0x2a3f60, 0x1b2b44);
    g.position.y = A.grid.y === undefined ? -0.001 : A.grid.y;
    if (A.grid.rot) g.rotation.set.apply(g.rotation, A.grid.rot);

  }

  /* ---------------- 工具 ---------------- */
  var V3 = THREE.Vector3;
  var _a = new V3(), _b = new V3(), _d = new V3(), _q = new THREE.Quaternion();
  var UP = new V3(0, 1, 0);

  function arr(x, d) { return (x && x.length) ? x.slice() : (d || [0, 0, 0]); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpArr(a, b, t) {
    var n = Math.max(a.length, b.length), o = [];
    for (var i = 0; i < n; i++) o[i] = lerp(a[i] === undefined ? 0 : a[i], b[i] === undefined ? 0 : b[i], t);

  }

    var o = {};

  }
  function ease(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function col(c) { return c === undefined ? 0x8fb4ff : c; }

  function setOpacity(obj3d, op) {
    obj3d.traverse(function (m) {
      if (m.material) {
        var ms = Array.isArray(m.material) ? m.material : [m.material];
        for (var i = 0; i < ms.length; i++) {
          if (ms[i].__fixedOpacity === undefined) {
            ms[i].transparent = op < 1 || ms[i].transparent;
            ms[i].opacity = op;

          } else {
            ms[i].opacity = op * ms[i].__fixedOpacity;
          }
        }
      }
    });
  }

  /* 文字标签。支持用 \n 换行 —— 长句子折成两行，宽度立刻减半，
     在横向空间紧张的场景里非常有用。
     注意：scale 是「整个标签的高度」（世界单位），两行标签要写约两倍的值，
     单行字号才和单行标签一致。 */
  function makeLabel(text, color, size, bg) {
    var pad = 26, fs = 60, lh = fs * 1.32;
    var lines = String(text === undefined || text === null ? '' : text).split('\n');
    var c = document.createElement('canvas'), x = c.getContext('2d');
    x.font = 'bold ' + fs + 'px "Microsoft YaHei",sans-serif';
    var w = 0, i;
    for (i = 0; i < lines.length; i++) w = Math.max(w, x.measureText(lines[i]).width);
    c.width = Math.ceil(w) + pad * 2;
    c.height = fs + pad + (lines.length - 1) * lh;   // 单行时与旧版完全一致
    x = c.getContext('2d');
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
    x.font = 'bold ' + fs + 'px "Microsoft YaHei",sans-serif';
    x.fillStyle = color || '#eaf1fb';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (i = 0; i < lines.length; i++) {
      x.fillText(lines[i], c.width / 2, pad / 2 + fs / 2 + i * lh + 2);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    var sp = new THREE.Sprite(mat);
    var sc = size || 0.62;

        if (e.metro) html += box('metro', '打个比方', e.metro);
        if (e.steps && e.steps.length) {
          html += box('step', '一步一步推', '<ol style="margin-left:18px">' +
            e.steps.map(function (s) { return '<li style="margin:4px 0">' + s + '</li>'; }).join('') + '</ol>');
        }
        if (e.warn) html += box('warn', '最容易错的点', e.warn);
      } else {
        html = '<div class="ehead">' + (ok ? '✅ 答对了！' : '❌ 差一点') + '</div><div>' + (e || '') + '</div>';
      }
      return html;
    }
    A.quiz.opts.forEach(function (o, i) {
      var d = document.createElement('div');
      d.className = 'opt';
      d.textContent = String.fromCharCode(65 + i) + '. ' + o;
      d.addEventListener('click', function () {
        if (done) return;
        done = true;
        var ok = (i === A.quiz.answer);
        var kids = qopts.querySelectorAll('.opt');
        kids[A.quiz.answer].className = 'opt right';
        if (!ok) d.className = 'opt wrong';
        qexp.innerHTML = renderExp(ok, i);
        qexp.className = 'exp show';
        if (window.TRACK && TRACK.quiz) TRACK.quiz(ok, A.quiz, i);
      });
      qopts.appendChild(d);
    });
  }

  /* ---------------- 尺寸 ---------------- */
  /* 自适应取景：手机竖屏时水平视野会变窄，若不处理，场景左右会被裁掉。
     场景可声明 A.fit = {w: 需要的可见宽度, h: 需要的可见高度}（单位同场景坐标）。
     这里按需把相机往后拉，保证 w×h 这个矩形一定完整可见。 */
  function resize() {
    var w = vp.clientWidth || 800, h = vp.clientHeight || 600;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    var need = baseDist;
    followOn = !!(A.follow && camera.aspect < 1.05);
    var fit = (followOn && A.fitFollow) ? A.fitFollow : A.fit;
    if (fit) {
      var tanH = Math.tan(camera.fov * Math.PI / 360);
      var dW = (fit.w || 0) / (2 * tanH * Math.max(camera.aspect, 0.0001));
      var dH = (fit.h || 0) / (2 * tanH);
      need = Math.max(baseDist, dW, dH);
    }
    needDist = need;
    if (!followOn) { curLook.copy(lookV); camGoal.copy(lookV); }
    camera.position.copy(curLook).addScaledVector(camDir, needDist);
    camera.lookAt(curLook);
  }
  window.addEventListener('resize', resize);
  resize();
  if (loadmsg) loadmsg.style.display = 'none';
  requestAnimationFrame(function (t) { prev = t; frame(t); });
  window.__ANIM_READY__ = true;
  /* 调试/截图用：直接跳到某个时间点（秒） */
  window.__ANIM_SEEK__ = function (t) {
    var st = stageAt(clamp(t, 0, total));
    gotoStage(st.i);
    elapsed = clamp(t, 0, total);
    updateStage(stageAt(elapsed));
  };
  window.__ANIM_GOTO__ = gotoStage;
  window.__ANIM_STAGES__ = function () { return { starts: segStart.slice(), durs: segDur.slice(), total: total }; };
  /* 学习记录模块用：当前是否在播、播到第几段 */
  window.__ANIM_STATE__ = function () {
    return { playing: playing, finished: finished, stage: stageAt(elapsed).i, segs: stages.length, elapsed: elapsed };
  };
  /* 调试图层用：当前所有可见物体在世界坐标里的包围盒（含标签实际尺寸） */
  window.__ANIM_BBOX__ = function () {
    var box = new THREE.Box3(), v = new THREE.Vector3();
    for (var id in O) {
      var e = O[id];
      if (!e || !e.mesh) continue;
      if (e.state && e.state.vis === false) continue;
      if (e.state && e.state.op === 0) continue;
      var m = e.mesh;
      if (m.__isLabel) {
        var sc = m.scale;
        box.expandByPoint(v.set(m.position.x - sc.x / 2, m.position.y - sc.y / 2, 0));
        box.expandByPoint(v.set(m.position.x + sc.x / 2, m.position.y + sc.y / 2, 0));
      } else {
        m.updateMatrixWorld(true);
        box.expandByObject(m);
      }
    }
    if (box.isEmpty()) return null;
    return { min: [box.min.x, box.min.y], max: [box.max.x, box.max.y],
             look: [lookV.x, lookV.y], dist: baseDist };
  };
})();
</script>

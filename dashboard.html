<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3D动画知识库">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a6cd6'/%3E%3Ctext x='32' y='44' font-size='31' font-family='sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E3D%3C/text%3E%3C/svg%3E">
<title>刘千亦 · 学习记录看板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    background:#0b1220;color:#e8eef7;min-height:100vh;padding:18px 14px 60px;line-height:1.6;}
  .wrap{max-width:1000px;margin:0 auto;}
  a{color:#7fb0ff;}
  h1{font-size:20px;font-weight:800;letter-spacing:.5px;}
  .sub{font-size:13px;color:#8fa3c0;margin-top:4px;}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px;}
  .bar a,.bar button{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    background:#22334f;color:#dce8f7;border:1px solid #33507a;border-radius:8px;
    padding:9px 15px;text-decoration:none;display:inline-block;}
  .bar button.pri{background:#3d6fd4;border-color:#5b8ef0;color:#fff;}
  .bar button.warn{background:#3a2130;border-color:#7a3f5a;color:#f3c4d8;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:#101a2c;border:1px solid #1e2c44;border-radius:12px;padding:14px 16px;}
  .kpi .k{font-size:11.5px;color:#6f87a8;font-weight:800;letter-spacing:1px;}
  .kpi .v{font-size:24px;font-weight:800;margin-top:5px;color:#eaf1fb;font-variant-numeric:tabular-nums;}
  .kpi .v small{font-size:13px;font-weight:700;color:#8fa3c0;margin-left:3px;}
  h2{font-size:14px;font-weight:800;color:#5b8ddb;letter-spacing:1.5px;margin:22px 0 10px;}
  .card{background:#101a2c;border:1px solid #1e2c44;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .card .tt{font-size:15.5px;font-weight:800;}
  .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:#1c3252;color:#9fc2ff;margin-right:7px;}
  .card .meta{font-size:12.5px;color:#8fa3c0;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap;}
  .card .meta b{color:#dbe7f7;}
  .pbar{height:7px;background:#1c2a42;border-radius:4px;overflow:hidden;margin-top:10px;}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#3d6fd4,#5d9bff);}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;}
  .row button{font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    background:#22334f;color:#dce8f7;border:1px solid #33507a;border-radius:8px;padding:7px 12px;}
  .row button.ok{background:#16331f;border-color:#2f8f52;color:#9ff0b8;}
  .row button.done{background:#1c3b33;border-color:#2f7a63;color:#a8f0d6;}
  .due{background:#3a2f14;border-color:#8a6a1f;}
  .due .tt{color:#ffd166;}
  .wrong{background:#101a2c;border:1px solid #2a3a55;border-left:3px solid #a53838;
    border-radius:10px;padding:12px 14px;margin-bottom:9px;}
  .wrong .q{font-size:14px;font-weight:700;margin-bottom:6px;}
  .wrong .a{font-size:13px;color:#f7a8a8;}
  .wrong .a b{color:#9ff0b8;}
  .wrong .x{font-size:12.5px;color:#8fa3c0;margin-top:7px;border-top:1px dashed #2a3a55;padding-top:7px;}
  .empty{color:#8fa3c0;font-size:13.5px;background:#101a2c;border:1px dashed #24354f;
    border-radius:12px;padding:20px;text-align:center;}
  #out{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;
    background:#0e1830;border:1px solid #24354f;border-radius:10px;padding:13px;
    margin-top:10px;color:#b7c6dc;display:none;max-height:340px;overflow:auto;}
  .tip{font-size:12.5px;color:#8fa3c0;background:#0e1830;border:1px solid #22345a;
    border-radius:10px;padding:12px 14px;margin-top:14px;line-height:1.85;}
  .tip b{color:#e8eef7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>刘千亦 · 学习记录看板</h1>
  <div class="sub">记录保存在这台设备本地（不上传），手机和电脑各自独立。</div>

  <div class="bar">
    <a class="pri" href="index.html">← 回动画首页</a>
    <button id="btnCopy">📋 复制学习记录（发给家长）</button>
    <button id="btnRefresh">↻ 刷新</button>
    <button class="warn" id="btnClear">清空全部记录</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <h2>今天该复习（费曼复习法 · 1/3/7/15/30 天）</h2>
  <div id="due"></div>

  <h2>各知识点学习情况</h2>
  <div id="items"></div>

  <h2>错题本</h2>
  <div id="wrongs"></div>

  <div id="out"></div>

  <div class="tip">
    <b>费曼学习法怎么用？</b><br>
    看完一个动画后，让孩子<b>合上屏幕，用自己的话讲给家长听一遍</b>。讲得出来 → 点「讲给爸妈听 ✓」；讲不顺的地方，就是没真懂的地方，回去重看那一段。<br>
    复习节奏由系统按 <b>1 / 3 / 7 / 15 / 30 天</b> 自动排好，到期就在上面「今天该复习」里提醒。
  </div>
</div>

<script>
(function () {
  var KEY = 'qy_study_v1';
  var GAPS = [1, 3, 7, 15, 30];
  var LIST = [
    ['math_pythagoras', '数学', '勾股定理（赵爽弦图）'],
    ['math_quad', '数学', '二次函数：a、b、c 各管什么'],
    ['math_equation', '数学', '一元二次方程与判别式'],
    ['phy_buoyancy', '物理', '浮力与阿基米德原理'],
    ['phy_lens', '物理', '凸透镜成像规律'],
    ['phy_circuit', '物理', '串联和并联电路'],
    ['phy_ohm', '物理', '欧姆定律'],
    ['phy_heat', '物理', '比热容'],
    ['phy_power', '物理', '电功率'],
    ['phy_melt', '物理', '熔化与凝固'],
    ['phy_magnet', '物理', '通电螺线管的磁场'],
    ['phy_engine', '物理', '热机：四个冲程'],
    ['phy_pressure', '物理', '液体压强 p = ρgh'],
    ['chem_electrolysis', '化学', '电解水的微观本质'],
    ['chem_conservation', '化学', '质量守恒定律'],
    ['chem_oxygen', '化学', '氧气的实验室制取'],
    ['exp_filter', '实验', '过滤：一贴二低三靠'],
    ['exp_density', '实验', '天平量筒测密度'],
    ['sport_jump', '体育', '立定跳远动作分解'],
    ['sport_flex', '体育', '坐位体前屈']
  ];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function addDays(ds, n) {
    var p = ds.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n); return dstr(d);
  }
  function load() {
    try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function dur(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + '<small>秒</small>';
    var m = Math.floor(s / 60);
    if (m < 60) return m + '<small>分</small>';
    return Math.floor(m / 60) + '<small>时</small>' + (m % 60) + '<small>分</small>';
  }
  function esc(s) { return String(s == null ? '' : s); }
  function strip(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ''); }

  var DB = load() || { ver: 1, items: {}, days: {} };
  if (!DB.items) DB.items = {};
  if (!DB.days) DB.days = {};

  function it(k) { return DB.items[k] || null; }

  /* ---------------- 顶部统计 ---------------- */
  function renderKpis() {
    var keys = Object.keys(DB.items);
    var totalSec = 0, totalVisit = 0, doneN = 0;
    keys.forEach(function (k) {
      var x = DB.items[k];
      totalSec += x.seconds || 0;
      totalVisit += x.visits || 0;
      if ((x.segMax || 0) >= (x.segTotal || 5)) doneN++;
    });
    /* 连续学习天数 */
    var streak = 0, d = today();
    while (DB.days[d] && DB.days[d].seconds >= 60) { streak++; d = addDays(d, -1); }
    var todaySec = (DB.days[today()] || {}).seconds || 0;
    var quizN = 0, quizOk = 0;
    keys.forEach(function (k) { quizN += (DB.items[k].quizRight || 0) + (DB.items[k].quizWrong || 0); quizOk += (DB.items[k].quizRight || 0); });

    document.getElementById('kpis').innerHTML =
      '<div class="kpi"><div class="k">今天学习</div><div class="v">' + dur(todaySec) + '</div></div>' +
      '<div class="kpi"><div class="k">累计学习</div><div class="v">' + dur(totalSec) + '</div></div>' +
      '<div class="kpi"><div class="k">连续天数</div><div class="v">' + streak + '<small>天</small></div></div>' +
      '<div class="kpi"><div class="k">打开动画</div><div class="v">' + totalVisit + '<small>次</small></div></div>' +
      '<div class="kpi"><div class="k">看完的知识点</div><div class="v">' + doneN + '<small>/ ' + LIST.length + '</small></div></div>' +
      '<div class="kpi"><div class="k">自测正确率</div><div class="v">' +
        (quizN ? Math.round(quizOk / quizN * 100) + '<small>%</small>' : '—') +
        '<small style="font-size:11px">（' + quizOk + '/' + quizN + '）</small></div></div>';
  }

  /* ---------------- 今天该复习 ---------------- */
  function renderDue() {
    var t = today(), list = [];
    Object.keys(DB.items).forEach(function (k) {
      var x = DB.items[k];
      if (x.reviewAt && x.reviewAt <= t) {
        list.push({ k: k, x: x, late: x.reviewAt < t });
      }
    });
    var box = document.getElementById('due');
    if (!list.length) {
      box.innerHTML = '<div class="empty">今天没有到期的复习 🎉<br>看完新的动画后，系统会自动按 1 / 3 / 7 / 15 / 30 天排好复习计划。</div>';
      return;
    }
    box.innerHTML = list.map(function (o) {
      var x = o.x, name = x.title || o.k;
      return '<div class="card due">' +
        '<div class="top"><div class="tt">' + (o.late ? '⏰ 已逾期 · ' : '📅 今天 · ') + esc(name) + '</div>' +
        '<div style="font-size:12px;color:#c9a95a">计划日 ' + x.reviewAt + '</div></div>' +
        '<div class="meta"><span>第 <b>' + ((x.gapIdx || 0) + 1) + '</b> / ' + GAPS.length + ' 次复习</span>' +
        '<span>下次间隔 <b>' + (GAPS[Math.min((x.gapIdx || 0) + 1, GAPS.length - 1)]) + '</b> 天</span></div>' +
        '<div class="row">' +
        '<button class="done" data-rev="' + o.k + '">✅ 讲给爸妈听过了（费曼）</button>' +
        '<a href="' + o.k + '.html" style="font-size:12.5px;font-weight:700;background:#22334f;border:1px solid #33507a;border-radius:8px;padding:7px 12px;color:#dce8f7;text-decoration:none">▶ 再讲一遍</a>' +
        '</div></div>';
    }).join('');
  }

  /* ---------------- 知识点卡片 ---------------- */
  function renderItems() {
    var html = LIST.map(function (p) {
      var k = p[0], subj = p[1], name = p[2];
      var x = it(k);
      var seen = x && (x.segMax || 0) > 0;
      var pct = x ? Math.min(100, Math.round((x.segMax || 0) / Math.max(1, x.segTotal || 5) * 100)) : 0;
      var fey = (x && x.feynman) ? x.feynman.length : 0;
      return '<div class="card">' +
        '<div class="top"><div class="tt"><span class="tag">' + subj + '</span>' + esc(name) + '</div>' +
        '<div style="font-size:12px;color:#8fa3c0">' + (seen ? '上次：' + (x.lastAt || '').slice(0, 10) : '还没看过') + '</div></div>' +
        '<div class="meta">' +
          '<span>观看 <b>' + (x ? x.visits || 0 : 0) + '</b> 次</span>' +
          '<span>时长 <b>' + (x ? Math.round(x.seconds || 0) : 0) + '</b> 秒</span>' +
          '<span>看完 <b>' + (x ? x.segMax || 0 : 0) + '</b>/' + (x ? x.segTotal || 5 : 5) + ' 段</span>' +
          '<span>自测 <b>' + (x ? x.quizRight || 0 : 0) + '</b> 对 / <b>' + (x ? x.quizWrong || 0 : 0) + '</b> 错</span>' +
          '<span>费曼 <b>' + fey + '</b> 次</span>' +
          (x && x.reviewAt ? '<span>下次复习 <b>' + x.reviewAt + '</b></span>' : '') +
        '</div>' +
        '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="row">' +
          '<a href="' + k + '.html" style="font-size:12.5px;font-weight:700;background:#22334f;border:1px solid #33507a;border-radius:8px;padding:7px 12px;color:#dce8f7;text-decoration:none">▶ 去学习</a>' +
          (seen ? '<button class="ok" data-fey="' + k + '">🙋 讲给爸妈听 ✓</button>' : '') +
          (x && x.wrongs && x.wrongs.length ? '<span style="font-size:12px;color:#f7a8a8;align-self:center">错题 ' + x.wrongs.length + ' 道</span>' : '') +
        '</div></div>';
    }).join('');
    document.getElementById('items').innerHTML = html;
  }

  /* ---------------- 错题本 ---------------- */
  function renderWrongs() {
    var all = [];
    Object.keys(DB.items).forEach(function (k) {
      var x = DB.items[k];
      (x.wrongs || []).forEach(function (w) {
        all.push({ k: k, name: x.title || k, w: w });
      });
    });
    all.sort(function (a, b) { return (b.w.t || '') < (a.w.t || '') ? -1 : 1; });
    var box = document.getElementById('wrongs');
    if (!all.length) {
      box.innerHTML = '<div class="empty">还没有错题。做完每个动画里的「自测」题，答错会自动进这里。</div>';
      return;
    }
    box.innerHTML = all.slice(0, 40).map(function (o) {
      var w = o.w;
      var right = strip((w.opts || [])[w.answer] || '');
      var mine = strip((w.opts || [])[w.chosen] || '');
      return '<div class="wrong">' +
        '<div class="q">' + strip(w.q) + '</div>' +
        '<div class="a">你选：<span style="color:#f7a8a8">' + mine + '</span>　｜　正确：<b>' + right + '</b></div>' +
        '<div class="x">' + esc(w.exp) + '</div>' +
        '<div class="x" style="border:none;padding-top:4px;color:#6f87a8">来自《' + esc(o.name) + '》　' + (w.t || '').slice(0, 10) + '</div>' +
        '</div>';
    }).join('');
  }

  /* ---------------- 复制给家长 ---------------- */
  function report() {
    var L = [];
    L.push('刘千亦 3D 动画学习记录');
    L.push('生成时间：' + new Date().toLocaleString('zh-CN'));
    var totalSec = 0, totalVisit = 0;
    Object.keys(DB.items).forEach(function (k) { totalSec += DB.items[k].seconds || 0; totalVisit += DB.items[k].visits || 0; });
    var streak = 0, d = today();
    while (DB.days[d] && DB.days[d].seconds >= 60) { streak++; d = addDays(d, -1); }
    L.push('累计学习：' + Math.round(totalSec / 60) + ' 分钟　｜　连续 ' + streak + ' 天　｜　打开动画 ' + totalVisit + ' 次');
    L.push('');
    L.push('【各知识点】');
    LIST.forEach(function (p) {
      var x = it(p[0]);
      if (!x || !(x.segMax || 0)) { L.push('· ' + p[2] + '：未学习'); return; }
      L.push('· ' + p[2] + '：看 ' + x.visits + ' 次 / ' + Math.round(x.seconds || 0) + ' 秒 / 看完 '
        + (x.segMax || 0) + '-' + (x.segTotal || 5) + ' 段 / 自测 ' + (x.quizRight || 0) + '对'
        + (x.quizWrong || 0) + '错 / 费曼 ' + ((x.feynman || []).length) + ' 次'
        + (x.reviewAt ? ' / 下次复习 ' + x.reviewAt : ''));
    });
    var ws = [];
    Object.keys(DB.items).forEach(function (k) {
      (DB.items[k].wrongs || []).forEach(function (w) {
        ws.push('· 【' + (DB.items[k].title || k) + '】' + strip(w.q) + ' → 正确答案：'
          + strip((w.opts || [])[w.answer] || ''));
      });
    });
    if (ws.length) { L.push(''); L.push('【错题 ' + ws.length + ' 道】'); ws.slice(0, 30).forEach(function (s) { L.push(s); }); }
    L.push('');
    L.push('【今天该复习】');
    var due = Object.keys(DB.items).filter(function (k) {
      var x = DB.items[k]; return x.reviewAt && x.reviewAt <= today();
    }).map(function (k) { return DB.items[k].title || k; });
    L.push(due.length ? due.join('、') : '（今天没有到期复习）');
    return L.join('\n');
  }

  function doCopy() {
    var txt = report();
    var out = document.getElementById('out');
    out.style.display = 'block';
    out.textContent = txt;
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); alert('已复制！可以直接粘到微信发给家长。'); }
      catch (e) { alert('复制失败，请长按下面的文字手动复制。'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        alert('已复制！可以直接粘到微信发给家长。');
      }).catch(fallback);
    } else { fallback(); }
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'BUTTON') return;
    var rev = t.getAttribute('data-rev'), fey = t.getAttribute('data-fey');
    if (rev || fey) {
      var k = rev || fey, x = DB.items[k];
      if (!x) return;
      x.feynman = x.feynman || [];
      x.feynman.push(new Date().toISOString());
      x.reviewDone = x.reviewDone || [];
      x.reviewDone.push(today());
      var gi = (x.gapIdx || 0) + 1;
      if (gi < GAPS.length) { x.gapIdx = gi; x.reviewAt = addDays(today(), GAPS[gi]); }
      else { x.gapIdx = gi; x.reviewAt = ''; }
      save(DB);
      renderAll();
      alert('记下了！下次复习安排在：' + (x.reviewAt || '已完成全部 5 次复习 🎉'));
    }
  });
  document.getElementById('btnCopy').addEventListener('click', doCopy);
  document.getElementById('btnRefresh').addEventListener('click', function () {
    DB = load() || { ver: 1, items: {}, days: {} }; renderAll();
  });
  document.getElementById('btnClear').addEventListener('click', function () {
    if (confirm('确定清空全部学习记录吗？这个操作不能撤销。')) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      DB = { ver: 1, items: {}, days: {} };
      renderAll();
    }
  });

  function renderAll() { renderKpis(); renderDue(); renderItems(); renderWrongs(); }
  renderAll();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- iPad / 手机「添加到主屏幕」后全屏打开，没有地址栏，像原生 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3D动画知识库">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a6cd6'/%3E%3Ctext x='32' y='44' font-size='31' font-family='sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3E3D%3C/text%3E%3C/svg%3E">
<title>3D 知识点动画</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
    background:#0b1220;color:#e8eef7;overflow:hidden;height:100vh;height:100dvh;}
  #app{display:flex;height:100vh;height:100dvh;width:100vw;position:relative;}
  #viewport{flex:1;position:relative;min-width:0;touch-action:none;}
  canvas{display:block;}

  .topbar{position:absolute;top:0;left:0;right:0;padding:15px 22px;
    background:linear-gradient(180deg,rgba(11,18,32,.92),rgba(11,18,32,0));
    pointer-events:none;z-index:10;}
  .topbar .t1{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .topbar .t2{font-size:12.5px;color:#8fa3c0;margin-top:3px;}
  .eq{position:absolute;top:15px;right:22px;z-index:10;
    background:rgba(30,45,70,.85);border:1px solid rgba(120,160,220,.3);
    border-radius:10px;padding:10px 15px;font-size:15.5px;font-weight:750;
    backdrop-filter:blur(6px);max-width:44%;line-height:1.5;}
  .eq small{display:block;font-size:11.5px;font-weight:600;color:#8fa3c0;margin-top:5px;letter-spacing:0;line-height:1.5;}

  /* 字幕条 —— 电脑上浮在画面下方；手机上移到画面外面，绝不遮挡动画 */
  #caption{position:absolute;left:0;width:calc(100% - 318px);bottom:96px;z-index:12;
    text-align:center;pointer-events:none;transition:opacity .3s;opacity:0;}
  #caption.show{opacity:1;}
  #caption .capbox{display:inline-block;max-width:min(880px,92%);text-align:center;
    background:rgba(16,26,44,.93);border:1px solid rgba(93,155,255,.32);
    border-radius:13px;padding:14px 26px;font-size:20px;font-weight:600;
    line-height:1.7;letter-spacing:.2px;color:#f2f7ff;backdrop-filter:blur(8px);}
  #caption .spk{display:inline-block;font-size:13px;font-weight:800;color:#5d9bff;
    letter-spacing:1.5px;margin-right:9px;vertical-align:2px;}
  #eqmini{display:none;}

  #side{width:318px;flex-shrink:0;background:#101a2c;border-left:1px solid #1e2c44;
    display:flex;flex-direction:column;overflow-y:auto;}
  .sec{padding:14px 18px;border-bottom:1px solid #1a2740;}
  .sec .h{font-size:12px;font-weight:800;color:#5b8ddb;letter-spacing:1.5px;margin-bottom:9px;}
  .stepbox{background:#16233a;border-radius:9px;padding:10px 13px;margin-bottom:8px;
    border-left:3px solid #3d6fd4;transition:all .3s;}
  .stepbox.on{background:#1c3252;border-left-color:#5d9bff;box-shadow:0 0 0 1px rgba(93,155,255,.35);}
  .stepbox .n{font-size:10.5px;color:#6f87a8;font-weight:700;margin-bottom:3px;}
  .stepbox .d{font-size:12.5px;line-height:1.65;color:#b7c6dc;}
  .stepbox.on .d{color:#e8eef7;font-weight:650;}
  .hint{font-size:12.5px;color:#8fa3c0;line-height:1.85;}
  .hint b{color:#e8eef7;}
  .legend{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;font-size:13px;color:#c3d2e6;}
  .legend i{width:15px;height:15px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;}

  .param{margin:11px 0;}
  .param label{font-size:12.5px;color:#a8bcd8;display:flex;justify-content:space-between;
    align-items:baseline;margin-bottom:5px;font-weight:600;}
  .param label b{color:#5d9bff;font-size:14px;font-variant-numeric:tabular-nums;}
  .param input[type=range]{width:100%;accent-color:#5d9bff;}

  #ctrl{position:absolute;bottom:0;left:0;right:0;padding:13px 22px 17px;
    background:linear-gradient(0deg,rgba(11,18,32,.96),rgba(11,18,32,0));
    display:flex;align-items:center;gap:11px;z-index:10;flex-wrap:wrap;}
  button,#ctrl a{font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    background:#22334f;color:#dce8f7;border:1px solid #33507a;
    border-radius:8px;padding:8px 15px;transition:.2s;text-decoration:none;display:inline-block;}
  button:hover{background:#2c4468;border-color:#4a76b5;}
  button.pri{background:#3d6fd4;border-color:#5b8ef0;color:#fff;}
  button.pri:hover{background:#4a80e6;}
  button.mute{background:#2a2036;border-color:#5a4374;color:#d9c8f5;}
  button.mute.on{background:#5a3f86;border-color:#9c82e8;color:#fff;}
  button.fs{background:#1c3b33;border-color:#2f7a63;color:#a8f0d6;}
  .progress{flex:1;min-width:140px;height:6px;background:#1c2a42;border-radius:3px;overflow:hidden;position:relative;}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,#3d6fd4,#5d9bff);}
  .progress .marks{position:absolute;inset:0;display:flex;pointer-events:none;}
  .progress .marks span{flex-grow:0;border-right:1px solid rgba(255,255,255,.22);}
  .sp{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8fa3c0;}
  .sp input{width:84px;accent-color:#5d9bff;}

  #quiz{position:absolute;inset:0;background:rgba(8,13,23,.95);z-index:50;
    display:none;align-items:center;justify-content:center;padding:26px;}
  #quiz.show{display:flex;}
  .qcard{max-width:680px;width:100%;background:#101a2c;border:1px solid #24354f;
    border-radius:14px;padding:24px 27px;max-height:92vh;overflow-y:auto;}
  .qcard .qh{font-size:12px;font-weight:800;color:#5b8ddb;letter-spacing:1.5px;margin-bottom:12px;}
  .qcard .q{font-size:17px;line-height:1.85;margin-bottom:14px;color:#e8eef7;}
  .opt{background:#16233a;border:1px solid #24354f;border-radius:9px;padding:12px 16px;
    margin:9px 0;font-size:16px;cursor:pointer;transition:.2s;color:#c3d2e6;}
  .opt:hover{border-color:#4a76b5;background:#1c2c46;}
  .opt.right{background:#16331f;border-color:#2f8f52;color:#9ff0b8;}
  .opt.wrong{background:#331717;border-color:#a53838;color:#f7a8a8;}
  .exp{margin-top:13px;padding:15px 17px;background:#16233a;border-radius:9px;
    font-size:15px;line-height:1.85;color:#c3d2e6;display:none;}
  .exp.show{display:block;}
  .exp b{color:#9ff0b8;}
  .exp .ehead{font-size:16px;font-weight:800;color:#ffd166;margin-bottom:8px;}
  .exp .ebox{margin-top:11px;padding:11px 13px;border-radius:8px;background:#1b2a42;
    border-left:3px solid #5d9bff;}
  .exp .ebox .et{font-size:12px;font-weight:800;color:#7fb0ff;letter-spacing:1px;margin-bottom:5px;}
  .exp .ebox.metro{border-left-color:#ffb454;}
  .exp .ebox.metro .et{color:#ffb454;}
  .exp .ebox.warn{border-left-color:#ff7b7b;}
  .exp .ebox.warn .et{color:#ff9b9b;}
  .exp .ebox.step{border-left-color:#7de2a0;}
  .exp .ebox.step .et{color:#7de2a0;}
  #loadmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#8fa3c0;z-index:60;background:#0b1220;text-align:center;padding:24px;line-height:1.8;}

  /* ---------- 手机 / 窄屏适配：画面在上，字幕独立一条，文字在下 ----------
     除了窄屏，**竖屏的平板**（iPad 810/820/834 宽）也走这一套：
     否则 iPad 竖屏会落进电脑版双栏，3D 区被 318px 侧栏挤成窄条。 */
  @media (max-width: 900px), (orientation: portrait) and (max-width: 1100px){
    #app{flex-direction:column;}
    #viewport{flex:none;height:46vh;min-height:250px;}
    #side{width:100%;flex:1 1 auto;border-left:none;border-top:1px solid #1e2c44;}
    .topbar{padding:9px 13px;}
    .topbar .t1{font-size:14px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar .t2{display:none;}
    /* 手机上没有横向空间放浮层，公式/要点改到字幕条里显示，画面顶部彻底空出来 */
    .eq{display:none;}
    #eqmini{display:block;font-size:12.5px;font-weight:800;color:#ffd166;
      margin-bottom:5px;line-height:1.45;letter-spacing:.2px;}

    /* 字幕：从浮层变成画面下面的一条，永远看得见，也不压画面 */
    #caption{position:static;width:100%;bottom:auto;opacity:1;text-align:left;
      background:#0e1830;border-top:1px solid #22345a;border-bottom:1px solid #22345a;
      padding:9px 14px;flex:none;max-height:22vh;overflow-y:auto;}
    #caption .capbox{display:block;max-width:100%;background:none;border:none;
      border-radius:0;padding:0;font-size:16px;line-height:1.62;text-align:left;font-weight:600;}
    #caption .spk{display:none;}

    #ctrl{padding:7px 9px 9px;gap:6px;}
    #ctrl button{padding:7px 9px;font-size:12.5px;}
    .progress{order:10;flex:1 1 100%;min-width:0;margin-top:2px;}
    .sp{display:none;}
    .sec{padding:11px 13px;}
    .sec .h{margin-bottom:7px;}
    .stepbox{padding:8px 11px;margin-bottom:6px;}
    .stepbox .d{font-size:12.5px;line-height:1.6;}
    .legend{font-size:12.5px;}
    .qcard .q{font-size:16px;}
    .opt{font-size:15px;}
    .exp{font-size:14.5px;}
  }
  @media (max-width: 420px){
    #viewport{height:42vh;min-height:230px;}
    #ctrl button{padding:6px 8px;font-size:12px;}
    #caption{font-size:15.5px;padding:8px 12px;}
    #caption .capbox{font-size:15.5px;}
  }
  /* 竖屏平板（iPad）：屏幕大，3D 区给高一点，字幕字也大一点 */
  @media (min-width: 700px) and (max-width: 1100px) and (orientation: portrait){
    #viewport{height:54vh;min-height:420px;}
    #caption{font-size:17.5px;padding:12px 22px;}
    #caption .capbox{font-size:17.5px;}
    #eqmini{font-size:14px;}
    .stepbox .d{font-size:14px;}
    .sec .h{font-size:13px;}
  }
  /* 全屏时把动画区再放大一些 */
  #app:fullscreen #viewport{height:62vh;}
  #app:-webkit-full-screen #viewport{height:62vh;}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="loadmsg">3D 动画与语音加载中…<br><span style="font-size:12.5px">（首次打开约需 1 秒）</span></div>
    <div class="topbar">
      <div class="t1" id="ttl"></div>
      <div class="t2" id="sub"></div>
    </div>
    <div class="eq" id="eq"></div>
    <div id="ctrl">
      <button class="pri" id="btnPlay">▶ 播放讲解</button>
      <button id="btnReset">↺ 重播</button>
      <button class="mute" id="btnMute">🔊 声音开</button>
      <button class="fs" id="btnFull">⛶ 全屏</button>
      <div class="progress"><div class="bar" id="bar"></div><div class="marks" id="marks"></div></div>
      <div class="sp">速度 <input type="range" id="spd" min="0.5" max="1.8" step="0.1" value="1"></div>
      <button id="btnQuiz" style="background:#7a5cd6;border-color:#9c82e8;color:#fff;">自测 ▸</button>
      <a href="dashboard.html" style="background:#1c3b33;border-color:#2f7a63;color:#a8f0d6;">📊 学习记录</a>
    </div>
  </div>
  <div id="caption"><div class="capbox"><div id="eqmini"></div><span class="spk">讲解</span><span id="captext"></span></div></div>
  <div id="side">
    <div class="sec"><div class="h">讲解步骤</div><div id="steps"></div></div>
    <div class="sec" id="paramSec" style="display:none;"><div class="h" id="paramTitle">动手调一调</div><div id="params"></div></div>
    <div class="sec" id="legendSec" style="display:none;"><div class="h">图例</div><div class="legend" id="legend"></div></div>
    <div class="sec"><div class="h">怎么用</div><div class="hint" id="hint"></div></div>
  </div>
  <div id="quiz"><div class="qcard">
    <div class="qh">看完立刻做一题</div>
    <div class="q" id="qtext"></div>
    <div id="qopts"></div>
    <div class="exp" id="qexp"></div>
  </div></div>
</div>

<!-- 顺序很重要：先引擎库 → 再数据 → 再场景声明 → 再学习记录 → 最后启动引擎 -->

  function limb(id, r, r2, color) { return { id: id, type: 'limb', r: r, r2: r2, color: color, a: [0, 0, 0], b: [0, 0, 0] }; }
  function ball(id, r, color) { return { id: id, type: 'sphere', r: r, color: color, at: [0, 0, 0] }; }
  function cube(id, size, color) { return { id: id, type: 'box', size: size, color: color, at: [0, 0, 0] }; }

  /* ---------------- 静态物体声明 ----------------
     opt.longPants = true  → 穿长裤（小腿也用裤子色，避免手臂和小腿都是肤色糊在一起） */
  function objects(opt) {
    opt = opt || {};
    var legColor = opt.longPants ? C.pants : C.skin;
    var o = [], sides = ['L', 'R'], i, s;
    /* 躯干：髋部（短裤）→ 腰 → 胸（上衣） */
    o.push(limb('g_hips', 0.126, 0.108, C.shorts));
    o.push(limb('g_chest', 0.108, 0.128, C.top));
    o.push(ball('g_shL', 0.085, C.top));
    o.push(ball('g_shR', 0.085, C.top));
    o.push(limb('g_neck', 0.042, 0.040, C.skin));
    /* 头 + 头发 + 马尾 + 五官 */
    o.push(ball('g_head', HEAD_R, C.skin));
    o.push(ball('g_hair', HEAD_R * 1.075, C.hair));
    o.push(limb('g_pony', 0.048, 0.018, C.hair));
    o.push(ball('g_eyeL', 0.0155, C.eye));
    o.push(ball('g_eyeR', 0.0155, C.eye));
    o.push(ball('g_browL', 0.010, C.brow));
    o.push(ball('g_browR', 0.010, C.brow));
    /* 四肢 */
    for (i = 0; i < 2; i++) {
      s = sides[i];
      o.push(ball('g_shoulder' + s, 0.050, C.top));       // 袖口球（肩）
      o.push(limb('g_sleeve' + s, 0.053, 0.047, C.top));  // 短袖
      o.push(limb('g_uarm' + s, 0.043, 0.037, C.skin));   // 上臂（露出的部分）
      o.push(limb('g_farm' + s, 0.035, 0.028, C.skin));   // 前臂
      o.push(ball('g_hand' + s, 0.044, C.skin));          // 手
      o.push(limb('g_shorts' + s, 0.090, 0.077, C.shorts)); // 短裤裤管
      o.push(limb('g_thigh' + s, 0.076, 0.062, legColor)); // 大腿
      o.push(limb('g_shin' + s, 0.059, 0.042, legColor));  // 小腿
      o.push(ball('g_knee' + s, 0.061, legColor));         // 膝盖
      o.push(cube('g_shoe' + s, [0.245, 0.072, 0.098], C.shoe));
      o.push(cube('g_sole' + s, [0.245, 0.024, 0.098], C.sole));
    }
    /* 影子 */
    o.push({ id: 'g_shadow', type: 'plane', w: 0.86, h: 0.54, color: 0x081222, op: 0.42, rot: [-Math.PI / 2, 0, 0], at: [0, 0.006, 0] });
    return o;
  }

  /* ---------------- 小工具 ---------------- */
  function v(x, y) { return [x, y]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
  function mul(a, k) { return [a[0] * k, a[1] * k]; }
  function len(a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1]) || 1e-6; }
  function unit(a) { var l = len(a); return [a[0] / l, a[1] / l]; }
  function toward(a, b, d) { return add(a, mul(unit(sub(b, a)), d)); }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function rot(a, ang) { var c = Math.cos(ang), s = Math.sin(ang); return [a[0] * c - a[1] * s, a[0] * s + a[1] * c]; }

  /* ---------------- 每帧更新 ---------------- */
  function update(O, P) {
    var hip = P.hip, sh = P.sh, knee = P.knee, ank = P.ank, elb = P.elb, hand = P.hand;

    /* 头：姿势数据只给方向，长度统一按比例重算，保证体型一致 */
    var hdir = unit(sub(P.head, sh));
    var up = hdir;                        // 头顶方向
    var fw = [up[1], -up[0]];             // 面朝方向（侧面 +x 为前）
    var headC = add(sh, mul(up, HEAD_OUT));

    /* 躯干三点 */
    var waist = mix(hip, sh, 0.50);
    var chest = mix(hip, sh, 0.80);

    /* --- 躯干 --- */
    setAB(O.g_hips, hip, waist);
    setAB(O.g_chest, waist, sh);
    setBall(O.g_shL, add(sh, mul(fw, -0.010)), ZS);
    setBall(O.g_shR, add(sh, mul(fw, -0.010)), -ZS);
    setAB(O.g_neck, toward(sh, headC, 0.03), toward(headC, sh, HEAD_R * 0.86));

    /* --- 头 / 头发 / 马尾 --- */
    setBall(O.g_head, headC, 0);
    setBall(O.g_hair, add(add(headC, mul(fw, -0.030)), mul(up, 0.016)), 0);
    var ponyBase = add(add(headC, mul(fw, -0.098)), mul(up, 0.052));
    var ponyTip = add(ponyBase, add(mul(fw, -0.175), mul(up, -0.215)));
    setAB(O.g_pony, ponyBase, ponyTip);
    var eyeC = add(add(headC, mul(fw, 0.104)), mul(up, 0.010));
    setBall(O.g_eyeL, eyeC, 0.044);
    setBall(O.g_eyeR, eyeC, -0.044);
    var browC = add(add(headC, mul(fw, 0.098)), mul(up, 0.052));
    setBall(O.g_browL, browC, 0.044);
    setBall(O.g_browR, browC, -0.044);

    /* --- 四肢（左右各一套） --- */
    var sides = ['L', 'R'], i, s, z, zl;
    for (i = 0; i < 2; i++) {
      s = sides[i];
      z = (s === 'L' ? 1 : -1);
      zl = z * ZL;
      /* 手臂 */
      var shP = add(add(sh, mul(fw, -0.010)), [0, 0, 0]);
      var sh3 = [shP[0], shP[1], z * ZS];
      var elb3 = [elb[0], elb[1], z * ZA];
      var hand3 = [hand[0], hand[1], z * ZA];
      var sleeveEnd = toward(sh3, elb3, Math.min(0.155, len(sub(elb3, sh3)) * 0.46));
      setAB3(O['g_sleeve' + s], sh3, sleeveEnd);
      setAB3(O['g_uarm' + s], sleeveEnd, elb3);
      setAB3(O['g_farm' + s], elb3, hand3);
      setBall3(O['g_shoulder' + s], add(sh3, mul(unit(sub(elb3, sh3)), 0.012)));
      setBall3(O['g_hand' + s], hand3);
      /* 腿 */
      var hip3 = [hip[0], hip[1], zl];
      var knee3 = [knee[0], knee[1], zl];
      var ank3 = [ank[0], ank[1], zl];
      var shortsEnd = toward(hip3, knee3, Math.min(0.235, len(sub(knee3, hip3)) * 0.50));
      setAB3(O['g_shorts' + s], hip3, shortsEnd);
      setAB3(O['g_thigh' + s], shortsEnd, knee3);
      setAB3(O['g_shin' + s], knee3, ank3);
      setBall3(O['g_knee' + s], knee3);
      /* 鞋：鞋头 = 小腿方向再转 90°+fa（fa>0 勾脚尖，fa<0 绷脚尖）
         站立时 fa=0 → 鞋头朝前平放；坐位体前屈小腿朝前 → 鞋头朝上 */
      var sd = unit(sub(ank3, knee3));
      var fd = rot(sd, Math.PI / 2 + (P.fa || 0));   // 鞋头方向
      var pd = [fd[1], -fd[0]];                      // 鞋底方向
      var shoeC = add(ank3, mul(fd, 0.098));
      var ang = Math.atan2(fd[1], fd[0]);
      setCube3(O['g_shoe' + s], shoeC, ang);
      setCube3(O['g_sole' + s], add(shoeC, mul(pd, 0.046)), ang);
    }

    /* --- 影子：跟着髋部走，人越高越淡越小 --- */
    var hgt = Math.max(0, hip[1] - 1.01);
    var k = 1 / (1 + hgt * 0.55);
    var shadow = O.g_shadow;
    if (shadow) {
      shadow.state.at = [hip[0], 0.006, 0];
      shadow.state.sc = [k, k, k];
      shadow.state.op = 0.42 * k;
    }
  }

  /* 设置 limb（a/b 两点 + z 深度） */
  function setAB(o, a2, b2) { o.state.a = [a2[0], a2[1], 0]; o.state.b = [b2[0], b2[1], 0]; }
  function setAB3(o, a3, b3) { o.state.a = [a3[0], a3[1], a3[2]]; o.state.b = [b3[0], b3[1], b3[2]]; }
  function setBall(o, p, z) { o.state.at = [p[0], p[1], z || 0]; }
  function setBall3(o, p3) { o.state.at = [p3[0], p3[1], p3[2]]; }
  function setCube3(o, p3, ang, dy) { o.state.at = [p3[0], p3[1] + (dy || 0), p3[2]]; o.state.rot = [0, 0, ang]; }

  return { objects: objects, update: update, COLORS: C };
})();
</script>
<script>/* 体育 · 立定跳远动作分解
   --------------------------------------------------------------------------
   侧面视角：x 为前进方向，y 为高度，单位 = 米（人物身高 1.90 米）
   人物由 rig.js 生成：有肉感的四肢、运动服、马尾、鞋子（真实初中女生形象）

(function () {

    },
    /* 起跳：蹬地伸展 + 两臂前上摆 */
    push: {
      hip: [0.10, 1.000], knee: [0.06, 0.530], ank: [0.02, 0.075],
      sh: [0.18, 1.540], head: [0.20, 1.760], elb: [0.52, 1.600], hand: [0.79, 1.680], fa: -0.10
    },
    /* 腾空：收腹举腿，小腿前伸 */
    air: {
      hip: [1.25, 1.550], knee: [1.70, 1.620], ank: [2.12, 1.450],
      sh: [1.36, 2.090], head: [1.42, 2.300], elb: [1.61, 1.840], hand: [1.84, 1.680], fa: 0.00
    },
    /* 落地：脚跟先着地 + 屈膝缓冲 + 两臂后摆 */
    land: {
      hip: [2.20, 0.830], knee: [2.46, 0.440], ank: [2.18, 0.075],
      sh: [2.351, 1.356], head: [2.414, 1.575], elb: [2.073, 1.139], hand: [1.828, 1.009], fa: 0.55
    }

    for (k in a) {

  /* 场景道具（人物以外的部分）
     注意：标签 scale 是世界单位高度，必须跟镜头距离匹配，否则字会大得离谱 */
  var PROPS = [

    { id: 'labTraj', type: 'label', text: '重心轨迹', scale: 0.22, at: [1.48, 1.82, 0], textColor: '#ffd166', op: 0 },

    { id: 'p1', type: 'label', text: '① 预备', scale: 0.28, at: [-0.16, 2.34, 0], textColor: '#9fd4ff' },
    { id: 'p2', type: 'label', text: '② 起跳', scale: 0.28, at: [0.40, 2.34, 0], textColor: '#ffb454', op: 0 },
    { id: 'p3', type: 'label', text: '③ 腾空', scale: 0.28, at: [1.18, 2.58, 0], textColor: '#7de2a0', op: 0 },
    { id: 'p4', type: 'label', text: '④ 落地', scale: 0.28, at: [2.34, 1.90, 0], textColor: '#ff9ad5', op: 0 }
  ];

  window.ANIM = {
    title: '立定跳远：四个阶段的动作分解',
    subtitle: '体育 · 中考项目 ｜ 预备 → 起跳 → 腾空 → 落地 ｜ 可 360° 旋转，建议横屏看全景',
    badge: '预备 → 起跳 → 腾空 → 落地<small>关键是：摆臂要到位、蹬地要用力、落地要屈膝缓冲</small>',
    camera: { pos: [1.05, 1.25, 4.30], look: [1.05, 1.10, 0] },
    /* 宽屏：完整看到整段跳跃；窄屏（手机竖屏）：镜头跟着人走，人物更清楚
       实测内容范围 x[-0.57, 2.85] y[-0.02, 2.72]（含 ①②③④ 标签），
       原来 h=2.95 会把头顶切掉一点，改成 3.6 */
    fit: { w: 4.05, h: 3.60 },
    fitFollow: { w: 2.95, h: 3.60 },
    follow: true,

    objects: RIG.objects().concat(PROPS),

    stages: [
      {
        step: '先看整体：四个阶段',
        text: '立定跳远，分四个阶段：预备、起跳、腾空、落地。',
        set: {}
      },
      {
        step: '① 预备：摆臂屈膝',
        text: '预备：两脚开立，与肩同宽，两臂前后摆动。手臂后摆的时候，膝盖弯曲下蹲。',
        set: { p1: { op: 0 }, p2: { op: 1 } }
      },
      {
        step: '② 起跳：蹬地展体',
        text: '起跳：两臂用力向前上方摆，同时两腿用力蹬地，身体充分展开。',

      },
      {
        step: '③ 腾空：收腹举腿',
        text: '腾空：身体在空中收腹举腿，小腿尽量往前伸。',

      {
        step: '④ 落地：屈膝缓冲',
        text: '落地：脚跟先着地，屈膝缓冲，手臂后摆保持平衡。注意，不要用手撑地。',

    tick: function (ctx) {
      var O = ctx.O, s = SEQ[ctx.stage] || SEQ[0];
      var P = lp(POSE[s[0]], POSE[s[1]], ctx.u);

      /* 人物：按姿势更新全部部件 */
      RIG.update(O, P);

      /* 重心轨迹：从蹬离地面（0.10, 1.00）到落地（2.20, 0.83），最高点 1.55
         抛物线 y = y0 + (y1−y0)t + 4h·t(1−t) */
      var pts = [], x0 = 0.10, x1 = 2.20, y0 = 1.00, y1 = 0.83, hh = 0.655, t;

        steps: [

          '起跳：两臂<b>往前上方</b>快速摆出，同时两腿猛蹬地、快速伸直 —— 手臂往上带，身体就往上飞。',

<script>

<script>
/* ================= 全屏按钮（iPhone 上降级为提示） ================= */
(function () {
  var btn = document.getElementById('btnFull'), root = document.getElementById('app');
  if (!btn || !root) return;
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function ok() { return !!(root.requestFullscreen || root.webkitRequestFullscreen); }
  function on() {
    var f = root.requestFullscreen || root.webkitRequestFullscreen;
    try { var p = f.call(root); if (p && p.catch) p.catch(function () { tip(); }); }
    catch (e) { tip(); }
  }
  function off() {
    var f = document.exitFullscreen || document.webkitExitFullscreen;
    if (f) try { f.call(document); } catch (e) {}
  }
  function tip() {
    alert('这个浏览器不支持网页全屏。\n\n【手机上这样看更大】\n点浏览器底部的「分享 / ⋯」→「添加到主屏幕」，\n以后从桌面图标打开，就是全屏效果。');
  }
  btn.addEventListener('click', function () { fsEl() ? off() : (ok() ? on() : tip()); });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      btn.textContent = fsEl() ? '⛶ 退出全屏' : '⛶ 全屏';
      setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 150);

  });
})();
/* ================= 手机上把「公式/要点浮层」搬进字幕条 =================

(function () {
  var eqEl = document.getElementById('eq'), mini = document.getElementById('eqmini');

  } catch (e) {}
  sync();
})();

      segStart.push(acc); segDur.push(d); acc += d;
    }
    total = acc || 1;
  })();

  var elapsed = 0, playing = false, muted = false, speed = 1, curSeg = -1, finished = false;

  function stageAt(t) {
    for (var i = 0; i < segDur.length; i++) {
      if (t < segStart[i] + segDur[i]) return { i: i, u: clamp((t - segStart[i]) / segDur[i], 0, 1) };
    }
    var last = segDur.length - 1;
    return { i: last, u: 1 };
  }

  /* ---------------- 音频 ---------------- */
  var host = document.createElement('div');
  host.id = 'audioHost'; host.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;';
  document.body.appendChild(host);
  var audios = [];
  for (var ai = 0; ai < AUDIO.length; ai++) {
    var el = document.createElement('audio');
    el.preload = 'auto';
    el.src = AUDIO[ai];
    host.appendChild(el);
    audios.push(el);
  }
  function pauseAll() { for (var i = 0; i < audios.length; i++) { try { audios[i].pause(); } catch (e) { } } }
  function playSeg(i) {
    if (muted || !audios[i]) return;
    pauseAll();
    var a = audios[i];
    try {
      a.playbackRate = speed;
      var off = clamp(elapsed - segStart[i], 0, (a.duration || 99));
      if (Math.abs(a.currentTime - off) > 0.28) a.currentTime = off;
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function () { });
    } catch (e) { }
  }

  /* ---------------- 步骤条 / 图例 / 参数 ---------------- */
  var stepEls = [];
  for (var si = 0; si < stages.length; si++) {
    var dv = document.createElement('div');
    dv.className = 'stepbox';
    dv.style.cursor = 'pointer';
    dv.title = '点击跳到这一步';
    dv.innerHTML = '<div class="n">第 ' + (si + 1) + ' 步</div><div class="d">' + (stages[si].step || stages[si].text) + '</div>';
    dv.onclick = (function (idx) { return function () { gotoStage(idx); }; })(si);
    stepsEl.appendChild(dv);
    stepEls.push(dv);
  }
  if (A.legend && A.legend.length) {
    document.getElementById('legendSec').style.display = '';
    document.getElementById('legend').innerHTML = A.legend.map(function (l) {
      return '<span><i style="background:' + l.color + '"></i>' + l.text + '</span>';
    }).join('');
  }
  var params = {};
  if (A.params && A.params.length) {
    document.getElementById('paramSec').style.display = '';
    if (A.paramTitle) document.getElementById('paramTitle').textContent = A.paramTitle;
    A.params.forEach(function (p) {
      params[p.id] = p.value;
      var w = document.createElement('div');
      w.className = 'param';
      w.innerHTML = '<label>' + p.label + ' <b id="pv_' + p.id + '">' + fmtP(p) + '</b></label>' +
        '<input type="range" id="pi_' + p.id + '" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + p.value + '">';
      document.getElementById('params').appendChild(w);
      w.querySelector('input').addEventListener('input', function (ev) {
        params[p.id] = parseFloat(ev.target.value);
        document.getElementById('pv_' + p.id).textContent = fmtP(Object.assign({}, p, { value: params[p.id] }));
        if (A.onParam) A.onParam(p.id, params[p.id], ctx());
      });
    });
  }
  function fmtP(p) {
    var v = p.value;
    if (p.fmt) return p.fmt(v);
    return (Math.round(v * 100) / 100) + (p.unit || '');
  }

  /* ---------------- 进度条 ---------------- */
  for (var mi = 0; mi < stages.length - 1; mi++) {
    var sp1 = document.createElement('span');
    sp1.style.flexGrow = String(segDur[mi]);
    marksEl.appendChild(sp1);
  }
  var spLast = document.createElement('span');
  spLast.style.flexGrow = String(segDur[segDur.length - 1] || 1);
  marksEl.appendChild(spLast);

  /* ---------------- 场景构建 ---------------- */
  if (A.objects) {
    A.objects.forEach(function (def) {
      var mesh = buildObject(def);
      O[def.id] = { def: def, mesh: mesh, state: initState(def) };
      order.push(def.id);
      applyState(O[def.id]);
    });
  }
  var ctxObj = null;
  function ctx() {
    if (!ctxObj) {
      ctxObj = { THREE: THREE, world: world, camera: camera, O: O, params: params, scene: scene, renderer: renderer };
    }
    var st = stageAt(elapsed);
    ctxObj.t = elapsed; ctxObj.stage = st.i; ctxObj.u = st.u;
    ctxObj.elapsed = elapsed; ctxObj.total = total; ctxObj.speed = speed; ctxObj.playing = playing;
    ctxObj.label = makeLabel;
    /* 跟随镜头：场景在 tick 里调用 ctx.look(x, y)，窄屏时镜头会平滑跟过去 */
    ctxObj.look = function (x, y) { camGoal.set(x, y === undefined ? lookV.y : y, 0); };
    return ctxObj;
  }
  if (A.build) A.build(ctx());

  /* ---------------- 主循环 ---------------- */
  var prev = performance.now();
  var snap = {}, tgt = {};

  function updateStage(st) {
    // 进入新段落时做快照
    if (st.i !== curSeg) {
      for (var id in O) { snap[id] = cloneState(O[id].state); }
      /* 目标状态 = 第 0~i 段 set 的「累积」（后面的覆盖前面的）。
         必须每次重建，否则 tgt 会残留旧段落的目标，
         导致重播 / 跳步时后面的标签提前淡入。 */
      var merged = {}, j, k3, k4, so;
      for (j = 0; j <= st.i; j++) {
        so = stages[j].set || {};
        for (k3 in so) {
          if (!O[k3]) continue;
          if (!merged[k3]) merged[k3] = {};
          for (k4 in so[k3]) {
            merged[k3][k4] = Array.isArray(so[k3][k4]) ? so[k3][k4].slice() : so[k3][k4];
          }
        }
      }
      tgt = {};
      for (var id2 in merged) {
        var t = merged[id2];
        tgt[id2] = {};
        for (var k in t) { tgt[id2][k] = Array.isArray(t[k]) ? t[k].slice() : t[k]; }
        if (t.vis !== undefined) O[id2].state.vis = t.vis;
      }
      curSeg = st.i;
      showCaption(st.i);
      if (playing) playSeg(st.i);
      for (var s2 = 0; s2 < stepEls.length; s2++) stepEls[s2].className = 'stepbox' + (s2 === st.i ? ' on' : '');
    }
    var e = ease(st.u);
    for (var id3 in tgt) {
      var o = O[id3]; if (!o) continue;
      var t2 = tgt[id3], s0 = snap[id3] || o.state;
      for (var k2 in t2) {
        if (k2 === 'vis') continue;
        var cur = o.state[k2], to = t2[k2];
        if (Array.isArray(to) && Array.isArray(s0[k2])) o.state[k2] = lerpArr(s0[k2], to, e);
        else if (k2 === 'op') o.state[k2] = lerp(s0.op === undefined ? 1 : s0.op, to, e);
      }
    }
  }

  function showCaption(i) {
    var st = stages[i]; if (!st) return;
    capText.textContent = st.caption || st.text || '';
    capEl.className = 'show';
    if (window.TRACK && TRACK.seg) TRACK.seg(i);
  }

  /* 跳到第 i 个讲解步骤：
     前面各段的 set 一次性落实（不插值），避免出现「残影」；
     当前段正常插值播放。步骤卡片可点击。 */
  function gotoStage(i) {
    if (!stages.length) return;
    i = clamp(i, 0, stages.length - 1);
    var j, id, k, t, so;
    for (j = 0; j < i; j++) {
      so = stages[j].set || {};
      for (id in so) {
        if (!O[id]) continue;
        t = so[id];
        for (k in t) {
          if (k === 'vis') { O[id].state.vis = t.vis; continue; }
          O[id].state[k] = Array.isArray(t[k]) ? t[k].slice() : t[k];
        }
      }
    }
    elapsed = segStart[i] || 0;
    finished = false;
    curSeg = -1;
    updateStage(stageAt(elapsed));
    if (playing) { pauseAll(); playSeg(i); }
  }

  function frame(now) {
    var dt = Math.min((now - prev) / 1000, 0.05); prev = now;
    if (playing && !finished) {
      elapsed += dt * speed;
      if (elapsed >= total) { elapsed = total; finish(); }
    }
    var st = stageAt(elapsed);
    updateStage(st);
    if (A.tick) A.tick(ctx());
    for (var i = 0; i < order.length; i++) applyState(O[order[i]]);
    if (followOn) {
      curLook.lerp(camGoal, 0.07);
      camera.position.copy(curLook).addScaledVector(camDir, needDist);
      camera.lookAt(curLook);
    }
    barEl.style.width = (elapsed / total * 100).toFixed(2) + '%';
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function finish() {
    playing = false; finished = true;
    pauseAll();
    btnPlay.textContent = '▶ 播放讲解';
    capEl.className = '';
    if (window.TRACK && TRACK.finish) TRACK.finish();
  }

  /* ---------------- 交互：旋转 ---------------- */
  var drag = false, lx = 0, ly = 0, rotY = 0, rotX = 0;
  world.rotation.y = A.spin || 0;
  function down(x, y) { drag = true; lx = x; ly = y; }
  function move(x, y) {
    if (!drag) return;
    rotY += (x - lx) * 0.0075; rotX += (y - ly) * 0.006;
    rotX = clamp(rotX, -0.95, 0.95);
    lx = x; ly = y;
    world.rotation.y = (A.spin || 0) + rotY;
    world.rotation.x = rotX;
  }
  function up() { drag = false; }
  vp.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', up);
  vp.addEventListener('touchstart', function (e) { var t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
  vp.addEventListener('touchmove', function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  vp.addEventListener('touchend', up);

  /* ---------------- 按钮 ---------------- */
  btnPlay.addEventListener('click', function () {
    if (playing) {
      playing = false; pauseAll(); btnPlay.textContent = '▶ 继续';
    } else {
      if (finished) { elapsed = 0; finished = false; curSeg = -1; for (var id in O) { O[id].state = initState(O[id].def); } }
      playing = true; btnPlay.textContent = '⏸ 暂停';
      capEl.className = 'show';
      playSeg(stageAt(elapsed).i);
    }
  });
  btnReset.addEventListener('click', function () {
    elapsed = 0; finished = false; playing = false; curSeg = -1; pauseAll();
    for (var id in O) { O[id].state = initState(O[id].def); }
    btnPlay.textContent = '▶ 播放讲解';
    capEl.className = '';
    for (var i = 0; i < stepEls.length; i++) stepEls[i].className = 'stepbox';
  });
  btnMute.addEventListener('click', function () {
    muted = !muted;
    btnMute.className = 'mute' + (muted ? ' on' : '');
    btnMute.textContent = muted ? '🔇 已静音' : '🔊 声音开';
    if (muted) pauseAll(); else if (playing) playSeg(stageAt(elapsed).i);
  });
  spd.addEventListener('input', function () {
    speed = parseFloat(spd.value);
    for (var i = 0; i < audios.length; i++) audios[i].playbackRate = speed;
  });
  btnQuiz.addEventListener('click', function () { quizEl.className = 'show'; });
  quizEl.addEventListener('click', function (e) { if (e.target === quizEl) quizEl.className = ''; });

  /* ---------------- 自测题 ----------------
     A.quiz.exp 支持两种写法：
       1) 字符串（老写法）
       2) 对象：{head 结论, metro 生活比喻, steps [逐步推理], warn 易错点}
     A.quiz.why 可选，长度与 opts 相同：每个选项「错在哪」。 */
  if (A.quiz) {
    qtext.innerHTML = A.quiz.q;
    var done = false;
    function box(cls, title, html) {
      if (!html) return '';
      return '<div class="ebox ' + cls + '"><div class="et">' + title + '</div>' + html + '</div>';
    }
    function renderExp(ok, i) {
      var e = A.quiz.exp, html = '';
      if (e && typeof e === 'object') {
        html += '<div class="ehead">' + (ok ? '✅ 答对了！' : '❌ 差一点，看完下面这段就懂了') + '</div>';
        if (e.head) html += '<div>' + e.head + '</div>';
        if (!ok && A.quiz.why && A.quiz.why[i]) {
          html += box('warn', '你选的 ' + String.fromCharCode(65 + i) + ' 错在哪', A.quiz.why[i]);
        }
        if (e.metro) html += box('metro', '打个比方', e.metro);
        if (e.steps && e.steps.length) {
          html += box('step', '一步一步推', '<ol style="margin-left:18px">' +
            e.steps.map(function (s) { return '<li style="margin:4px 0">' + s + '</li>'; }).join('') + '</ol>');
        }
        if (e.warn) html += box('warn', '最容易错的点', e.warn);
      } else {
        html = '<div class="ehead">' + (ok ? '✅ 答对了！' : '❌ 差一点') + '</div><div>' + (e || '') + '</div>';
      }
      return html;
    }
    A.quiz.opts.forEach(function (o, i) {
      var d = document.createElement('div');
      d.className = 'opt';
      d.textContent = String.fromCharCode(65 + i) + '. ' + o;
      d.addEventListener('click', function () {
        if (done) return;
        done = true;
        var ok = (i === A.quiz.answer);
        var kids = qopts.querySelectorAll('.opt');
        kids[A.quiz.answer].className = 'opt right';
        if (!ok) d.className = 'opt wrong';
        qexp.innerHTML = renderExp(ok, i);
        qexp.className = 'exp show';
        if (window.TRACK && TRACK.quiz) TRACK.quiz(ok, A.quiz, i);
      });
      qopts.appendChild(d);
    });
  }

  /* ---------------- 尺寸 ---------------- */
  /* 自适应取景：手机竖屏时水平视野会变窄，若不处理，场景左右会被裁掉。
     场景可声明 A.fit = {w: 需要的可见宽度, h: 需要的可见高度}（单位同场景坐标）。
     这里按需把相机往后拉，保证 w×h 这个矩形一定完整可见。 */
  function resize() {
    var w = vp.clientWidth || 800, h = vp.clientHeight || 600;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';

    var need = baseDist;
    followOn = !!(A.follow && camera.aspect < 1.05);
    var fit = (followOn && A.fitFollow) ? A.fitFollow : A.fit;
    if (fit) {
      var tanH = Math.tan(camera.fov * Math.PI / 360);
      var dW = (fit.w || 0) / (2 * tanH * Math.max(camera.aspect, 0.0001));
      var dH = (fit.h || 0) / (2 * tanH);
      need = Math.max(baseDist, dW, dH);
    }
    needDist = need;
    if (!followOn) { curLook.copy(lookV); camGoal.copy(lookV); }
    camera.position.copy(curLook).addScaledVector(camDir, needDist);
    camera.lookAt(curLook);
  }
  window.addEventListener('resize', resize);
  resize();
  if (loadmsg) loadmsg.style.display = 'none';
  requestAnimationFrame(function (t) { prev = t; frame(t); });
  window.__ANIM_READY__ = true;
  /* 调试/截图用：直接跳到某个时间点（秒） */
  window.__ANIM_SEEK__ = function (t) {
    var st = stageAt(clamp(t, 0, total));
    gotoStage(st.i);
    elapsed = clamp(t, 0, total);
    updateStage(stageAt(elapsed));
  };
  window.__ANIM_GOTO__ = gotoStage;
  window.__ANIM_STAGES__ = function () { return { starts: segStart.slice(), durs: segDur.slice(), total: total }; };
  /* 学习记录模块用：当前是否在播、播到第几段 */
  window.__ANIM_STATE__ = function () {
    return { playing: playing, finished: finished, stage: stageAt(elapsed).i, segs: stages.length, elapsed: elapsed };
  };
  /* 调试图层用：当前所有可见物体在世界坐标里的包围盒（含标签实际尺寸） */
  window.__ANIM_BBOX__ = function () {
    var box = new THREE.Box3(), v = new THREE.Vector3();
    for (var id in O) {
      var e = O[id];
      if (!e || !e.mesh) continue;
      if (e.state && e.state.vis === false) continue;
      if (e.state && e.state.op === 0) continue;
      var m = e.mesh;
      if (m.__isLabel) {
        var sc = m.scale;
        box.expandByPoint(v.set(m.position.x - sc.x / 2, m.position.y - sc.y / 2, 0));
        box.expandByPoint(v.set(m.position.x + sc.x / 2, m.position.y + sc.y / 2, 0));
      } else {
        m.updateMatrixWorld(true);
        box.expandByObject(m);
      }
    }
    if (box.isEmpty()) return null;
    return { min: [box.min.x, box.min.y], max: [box.max.x, box.max.y],
             look: [lookV.x, lookV.y], dist: baseDist };
  };
})();
</script>
</body>
</html>
